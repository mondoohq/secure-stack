name: Validate generated artifacts

on:
  pull_request:
    paths:
      - "scripts/SKILLS_TEMPLATE.md"
      - "scripts/generate_agents.ts"
      - "scripts/publish.sh"
      - "**/SKILL.md"
      - "agents/SKILLS.md"
      - "README.md"
      - ".claude-plugin/marketplace.json"
      - ".claude-plugin/plugin.json"
      # The other manifests a release stamps. validateVersions() checks all of
      # them, so a hand-edit here has to reach CI too.
      - ".cursor-plugin/marketplace.json"
      - ".cursor-plugin/plugin.json"
      - "gemini-extension.json"
      # Per-skill manifests: the version check has to see these, or a hand-edited
      # version could land without CI ever running.
      #
      # The single `*` assumes skills live exactly one level under skills/, which
      # is the layout collectSkills() in scripts/generate_agents.ts also requires
      # (it reads skills/<name>/SKILL.md and does not recurse). If skills are ever
      # nested deeper, this filter and that function have to change together.
      - "skills/*/.claude-plugin/plugin.json"
      # Mod manifests carry the same release version (see collectMods()).
      - "mods/*/.claude-plugin/plugin.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure generated files are up to date
        run: ./scripts/publish.sh --check

name: Release

# Publishes a release when a version bump lands on the default branch: mints the
# tag and creates the GitHub Release from CHANGELOG.md. There is nothing to run
# by hand — the release PR opened by prepare-release.yml is the decision point,
# and merging it triggers this.
#
# Trigger is the version *content*, not the commit message: the squash title is
# editable in the merge dialog, so a maintainer tidying "chore: release v1.1.0"
# into something else would silently disable releasing, with nothing to notice.
# So a `gate` job reads the version from plugin.json and decides; `release` and
# the optional Slack `notify-*` jobs key off its output and only run for a real
# version bump.
#
# The Slack notification is OPTIONAL and fail-safe: notify-start / notify-final
# run only when the `SLACK_RELEASE_CHANNEL_ID` repo variable is set (with the
# `SLACK_BOT_TOKEN` secret), are `continue-on-error`, and a Slack hiccup never
# fails or blocks the release itself.
#
# NOTE: the tag and Release are created with GITHUB_TOKEN, and GitHub suppresses
# workflow triggers for events it creates. Any future `on: release` or
# `on: push: tags:` workflow (e.g. publishing to a marketplace) would never fire
# — that would need a GitHub App token here instead.

on:
  push:
    branches: [main]
    paths: [".claude-plugin/plugin.json"]

# The default for all jobs is read; the `release` job inherits this write so it
# can create the tag + GitHub Release. (A job-level `contents: write` on top of a
# top-level `contents: read` baseline did NOT grant write here — the release 403'd
# on POST /releases — so the write lives at the top level, as it did through
# v1.0.1, and the notify/gate jobs drop back to read below.)
permissions:
  contents: write

concurrency:
  group: release
  # Never cancel a release mid-flight: that leaves a merged bump with no tag.
  cancel-in-progress: false

jobs:
  gate:
    name: Decide whether this push is a release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the pre-push commit to compare versions

      - name: Decide whether this push is a release
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version="$(jq -r .version .claude-plugin/plugin.json)"
          # The path filter only says plugin.json changed, not that the *version*
          # did — editing keywords or a description would otherwise publish.
          previous=""
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            previous="$(git show "${BEFORE}:.claude-plugin/plugin.json" 2>/dev/null | jq -r .version || true)"
          fi
          if [ -n "$previous" ] && [ "$previous" = "$version" ]; then
            echo "Version unchanged at ${version}; not a release push."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # When the previous version can't be read — `before` is all-zeros, or
          # history was rewritten so that commit is gone — this deliberately
          # falls through and attempts the release. Failing open is the right
          # bias: the tag guard below is a complete backstop (an existing tag at
          # this commit is a no-op, one at another commit is a loud error),
          # whereas failing closed would silently skip a genuine release, which
          # is the exact failure this whole flow exists to prevent.
          if [ -z "$previous" ]; then
            echo "::notice::Could not read the previous version from ${BEFORE}; proceeding, the tag guard decides."
          fi
          echo "Releasing v${version} (was ${previous:-<unknown>})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  # Optional: post a "release started" Slack message with the stage pending.
  # Runs only when the Slack channel variable is configured, and never blocks
  # the release (continue-on-error).
  notify-start:
    name: Notify release start
    needs: gate
    if: ${{ needs.gate.outputs.release == 'true' && vars.SLACK_RELEASE_CHANNEL_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.post.outputs.channel_id }}
      ts: ${{ steps.post.outputs.ts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Slack message
        run: node scripts/slack-release-message.mjs start > "$RUNNER_TEMP/slack.json"
        env:
          SLACK_CHANNEL: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
          RELEASE_VERSION: v${{ needs.gate.outputs.version }}
      - name: Post Slack message
        id: post
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack.json

  release:
    name: Tag and publish the GitHub Release
    needs: gate
    if: ${{ needs.gate.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    # No job-level permissions: inherit the top-level `contents: write` so the
    # release can be created (see the note on the top-level permissions block).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against a duplicate or mismatched tag
        id: tagguard
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}" "refs/tags/${tag}^{}" | head -1 | cut -f1)"
          if [ -z "$existing" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$existing" = "$GITHUB_SHA" ]; then
            # Re-run of an already-published release: safe no-op.
            echo "::notice::Tag ${tag} already points at ${GITHUB_SHA}; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # Failing loudly on purpose. Skipping here would silently drop a real
            # release whose tag was created out of band at a different commit.
            echo "::error::Tag ${tag} exists at ${existing} but this push is ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: Extract release notes
        if: steps.tagguard.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          # The changelog is what the reviewer approved, so the Release page and
          # the repo agree by construction. `generate_release_notes` would list
          # the release PR itself and drift from CHANGELOG.md whenever the notes
          # are edited during review.
          # First `## ` section only. The second awk holds blank lines back and
          # emits them only once more content follows, which drops the padding
          # before the next heading so the Release body has no trailing blanks.
          awk '/^## /{n++} n==1' CHANGELOG.md \
            | awk 'NF { while (held-- > 0) print ""; held = 0; print; next }
                   { held++ }' > release-notes.md
          if ! head -1 release-notes.md | grep -q "^## v${VERSION}\b"; then
            echo "::error::CHANGELOG.md's top section is not v${VERSION}: $(head -1 release-notes.md)" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create the tag and the GitHub Release
        if: steps.tagguard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          # `gh release create` mints the tag at --target, so no tag push — and
          # therefore no write to the PR-only default branch — is needed.
          #
          # A hyphen means a prerelease (2.0.0-rc.1): flag it so an rc never
          # becomes the repo's "Latest release".
          #
          # args[] is seeded non-empty on purpose — expanding an empty array
          # under `set -u` is an error on bash < 4.4.
          args=(--target "$GITHUB_SHA" --title "v${VERSION}" --notes-file release-notes.md)
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          gh release create "v${VERSION}" "${args[@]}"
          echo "Published v${VERSION}: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${VERSION}"

  # Optional: update the "release started" message in place with the result.
  # Runs whenever notify-start actually posted (its ts is set), success or not.
  notify-final:
    name: Notify release result
    needs: [gate, notify-start, release]
    if: ${{ always() && needs.notify-start.outputs.ts != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Slack message
        run: node scripts/slack-release-message.mjs final > "$RUNNER_TEMP/slack.json"
        env:
          SLACK_CHANNEL: ${{ needs.notify-start.outputs.channel }}
          SLACK_TS: ${{ needs.notify-start.outputs.ts }}
          SLACK_ALERT_GROUP: ${{ vars.SLACK_RELEASE_ALERT_GROUP_ID }}
          RELEASE_VERSION: v${{ needs.gate.outputs.version }}
          RESULT_RELEASE: ${{ needs.release.result }}
      - name: Update Slack message
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack.json
